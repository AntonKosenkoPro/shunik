name: ai-review
# Stage 1 of the two-stage review process (docs/review-process.md).
# OpenCodeReview (alibaba/open-code-review): deterministic file bundling + review agent.
# Manual trigger: comment "/review" on a PR. Advisory only — never blocks merge.
on:
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/review') &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      # issue_comment carries no PR refs — resolve head/base from the PR itself.
      - name: Resolve PR refs
        id: refs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);

      - name: Run OpenCodeReview
        # The action performs its own full checkout (fetch-depth: 0).
        uses: alibaba/open-code-review@v1.12.9
        with:
          # Ollama Cloud — OpenAI-compatible endpoint (models.dev: ollama-cloud base URL).
          llm_url: https://ollama.com/v1
          llm_auth_token: ${{ secrets.OLLAMA_API_KEY }}
          # glm-5.3-flash, thinking at max (benchmarked: deepest useful
          # reasoning on Ollama Cloud; reasoning_effort is ignored there).
          llm_model: glm-5.3-flash
          # openai protocol (explicit; supersedes the required llm_use_anthropic boolean)
          llm_protocol: openai
          llm_use_anthropic: 'false'
          llm_extra_body: '{"think": "max"}'
          llm_timeout: '600'
          review_task_timeout: '15'
          # Don't hammer Ollama Cloud rate limits.
          review_concurrency: '4'
          # Review effort medium (deeper per-file rounds; low was benchmarked
          # fastest without recall loss on small diffs — tune back if medium
          # proves wasteful there).
          effort: 'medium'
          # Bound paid-provider spend: generous runaway guard (fail-open —
          # over-budget files report failed(budget) but partial results still
          # publish). 10x headroom so large diffs review in one run.
          max_tokens_budget: '20000000'
          language: English
          # Update one summary comment in place instead of posting a new one per run.
          sticky_summary: 'true'
          # Cross-push checkpoints: the first /review covers merge-base..head; a later
          # /review covers only <checkpoint>..<head> (fail-closed: falls back to full).
          checkpoint_range: 'true'
          # All findings post inline (no severity routing to the summary).
          route_severity_below: ''
          upload_artifacts: 'true'
          # issue_comment carries no pull_request payload — pass the PR explicitly.
          pr_number: ${{ github.event.issue.number }}
          base_ref: ${{ steps.refs.outputs.base_ref }}
          head_sha: ${{ steps.refs.outputs.head_sha }}