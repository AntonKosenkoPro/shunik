  /api/v1/documents:
    post:
      operationId: createDocument
      summary: Create a document record
      description: |
        Creates a document metadata row (`ready=false`) with pet links and
        returns the `blob_key` the client uploads to via
        POST /api/v1/documents/{id}/upload-url. Bytes never travel through
        this API. Every `pet_ids` entry must belong to the household (else
        422 `invalid_pet_id`). Idempotent replay of an existing `id` returns
        the stored row with 200. Requires a valid Bearer access token.
      tags:
        - Documents
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Document record created (not yet uploaded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "200":
          description: Idempotent replay — a document with this id already exists; the stored row is returned unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_body
                  message: Invalid request body
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthorized
                  message: Invalid or expired access token
        "422":
          description: Unknown pet reference — a pet_id is not in the caller's household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
