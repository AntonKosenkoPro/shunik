schema: spec-driven

# Project context (shown to AI when creating artifacts).
# Read this first — it is the canonical, durable repository context (S7).
context: |
  Read `docs/project-context.md` before proposing, writing specs, implementing, or archiving anything:
  it is the canonical context for this repo (architecture, OpenSpec routing, API contract,
  incomplete surfaces, standards, build/test/run).

  What this is: Lifio — a personal time-tracking iOS app (SwiftUI, iOS 18+, local-first
  and account-bound: mandatory sign-in, per-account data files, per-device sessions)
  with a Go backend acting as identity + sync relay. Auth MVP (passwordless email-OTP +
  Sign in with Apple) and the Track experience (three-tab shell, numeric timer, plain-text
  capture + Recents, running tag selector, Profile, compact cross-tab timer). There is no
  activity entity — entries own their text, ordered categories, and notes.

  OpenSpec routing: baseline specs (`openspec/specs/<capability>/spec.md`) are the merged
  contract and are NEVER edited directly (20 baselines incl. `account-bound-store`,
  `device-sessions`, `apple-signin`, and `live-activities`). Behavior changes go through a change: delta specs
  under `openspec/changes/<change>/specs/`. The local-first architecture now lives in the
  `local-first-store`, `sync-client`, `entry-provenance`, and `lock-screen-controls` baselines.
  Archives (`openspec/changes/archive/`) are history already folded into the baselines. No
  active change right now (umbrella archive of 8 changes landed 2026-10-10:
  `separate-notes-editor`, `extend-notes-limit`, `fix-sync-entry-truncation`,
  `fix-track-empty-after-reinstall`, `fix-track-visual-glitches`,
  `fix-tab-bar-return-jump`, `category-chip-order-numbers`, `live-activities`).

  Non-negotiables: LocalStore is the single mutation chokepoint (GRDB, App Group
  `group.com.antonkosenko.timeoflifeapp`) — no raw GRDB writes outside it. Several local-first UI
  surfaces are INCOMPLETE (see docs/project-context.md → "Incomplete / deferred"): UndoToast /
  shake-to-undo, "via <Source>" labels, and the iOS 18 lock-screen ControlWidget itself (a
  widget extension target exists for Live Activities; the Control toggle is still deferred). OpenAPI (`backend/api/openapi.yaml`) is the authoritative API
  contract (S10). No backward compat for on-disk formats (pre-release). No passwords, no
  plaintext secrets (R1). iOS strings go to both `en.lproj` and `ru.lproj` + `L10n` (U4).
  XcodeGen-managed: edit `project.yml`, run `xcodegen generate`, never hand-edit the `.pbxproj`.
  SwiftUI views use `Theme` semantic colors only.

rules:
  proposal:
    - Identify affected baseline capabilities and authoritative documentation; include explicit non-goals.
    - 'Research bundle (mandatory for every feature/bugfix): resolve + fetch current docs via `npx ctx7@latest library` → `docs` (one concept per query, max 5: topic + applicable HIG guideline + Apple API + best practice) and cite library IDs + queries; state the version pin used. Waive an inapplicable bundle item only with a one-line reason + evidence (e.g. "HIG N/A — backend-only diff"), never by silence. Known IDs: HIG `/websites/developer_apple_design_human-interface-guidelines`, SwiftUI `/websites/developer_apple_swiftui`, ActivityKit `/websites/developer_apple_activitykit`; pin pattern "iOS 18 SDK via Xcode 16+".'
  design:
    - Preserve the invariants in `docs/project-context.md` and cite decisions that constrain implementation.
    - Cite the ctx7 library IDs + queries that constrain the design (or the waiver reasons for inapplicable bundle items); do not rely on training-data API shapes.
  specs:
    - Write change-scoped deltas only; never edit baseline specs directly while proposing a change.
  tasks:
    - Include relevant tests, linters, requirements checks, and documentation updates.
    - For bugfix changes, the first tasks reproduce the bug on the current tree (recorded steps + evidence) AND complete the ctx7 research bundle; implementation tasks come after both the repro and the research, and a final task re-runs the identical repro to verify the fix.
    - For every feature/bugfix change, include the ctx7 research bundle as the first task(s) (topic + applicable HIG + Apple API + best practice, max 5 queries); implementation tasks depend on it. For bugfix changes the repro and research tasks jointly gate implementation.

operations:
  apply:
    guidance:
      - Read `docs/project-context.md` first (canonical context; `AGENTS.md` is the short entrypoint).
      - Check the selected change's `tasks.md` before implementing and mark tasks `[x]` as you complete them; reconcile with the relevant `Requirements/FURPS/*.md` rows.
      - Bugfix rule: reproduce the bug first (recorded evidence), implement only after confirming the repro, and re-verify with the identical repro afterwards; if it cannot be reproduced, stop and report instead of guessing (see `docs/project-context.md` → "Per-iteration revising process"). Research and repro jointly gate implementation (both live in `tasks.md` section 1).
      - 'External docs first: for every feature/bugfix, run the ctx7 research bundle (`library` → `docs`, one concept per query, max 5: topic + applicable HIG + Apple API + best practice) before coding and cite IDs + queries + pins; waive an inapplicable item only with reason + evidence; on quota error ask for `npx ctx7@latest login` / `CONTEXT7_API_KEY`, never silently fall back.'
      - Worktree isolation: do all code work in a separated git worktree (`timeOfLife.wt/<change-name>`, one branch per worktree, created from fresh `origin/main`); the main checkout stays clean. Read-only explore stays worktree-free. Worktrees do not lift the one-`xcodebuild` / one-simulator / single-writer-file serialization.
      - 'Double rebase on `origin/main`: `git fetch origin` + rebase before implementing (fresh base) and again before opening the PR (mergeable head); re-run affected linters/tests after each rebase; pushed branches move via `push --force-with-lease`; never `merge main` into the branch.'
      - Deferred local-first UI surfaces (UndoToast/shake-to-undo, "via <Source>" labels, lock-screen ControlWidget) must not be claimed done; update `docs/project-context.md` → "Incomplete / deferred" and any owning change artifacts accordingly.
      - If the OpenAPI contract changes, update `backend/api/openapi.yaml` and both client/server sides (S10); run the backend contract gate (`go test ./...` includes `internal/contract`).
      - Run linters + warning-as-error build + both test suites per `docs/project-context.md` → "Per-iteration revising process (S5)".
  archive:
    guidance:
      - Read `docs/project-context.md` first (canonical context; `AGENTS.md` is the short entrypoint).
      - Archiving folds delta specs into the baselines — after `openspec archive`, the change moves to `openspec/changes/archive/` and its specs become the baseline contract.
      - After archiving, update `docs/project-context.md` (OpenSpec routing section + "Incomplete / deferred" list) and `openspec/README.md` if the set of active changes changed.
