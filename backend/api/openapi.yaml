    patch:
      operationId: updatePet
      summary: Update a pet
      description: |
        Last-writer-wins guarded update: `base_updated_at` must equal the
        stored row's `updated_at`, followed by the full mutable shape
        (`name`, `species`, `birthdate`, `notes`). A stale base returns 409
