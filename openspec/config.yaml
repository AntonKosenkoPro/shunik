schema: spec-driven

# Project context (shown to AI when creating artifacts).
# Read this first — it is the canonical, durable repository context (S7).
context: |
  Read `docs/project-context.md` before proposing, writing specs, implementing, or archiving anything:
  it is the canonical context for this repo (Shunik pet-care app: SwiftUI iOS 18+ local-first +
  Go identity + sync relay, currently an auth scaffold; v1 domain in `shunik-v1-foundation`).

# Per-artifact rules (keyed by artifact id — entries apply when writing that artifact).
rules:
  proposal:
    - 'Worktree gate (before any write): create `shunik.wt/<change-name>` from fresh `origin/main` (one branch `opsx/<change-name>` per worktree), move the session into it (`session_move`), and verify with `git worktree list` — THEN run `openspec new change` and write artifacts there. Planning artifacts are change-scoped writes; the main checkout stays clean (reads only).'
    - Identify affected baseline capabilities and authoritative documentation; include explicit non-goals.
    - 'Research bundle (mandatory for every feature/bugfix): resolve + fetch current docs via `npx ctx7@latest library` → `docs` (one concept per query, max 5) and cite library IDs + queries; state the version pin used. Waive an inapplicable bundle item only with a one-line reason + evidence, never by silence.'

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
