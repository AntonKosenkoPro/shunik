        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/households/members/{userId}:
    delete:
      operationId: removeMember
      summary: Remove member
      description: |
        Removes one membership (any member may remove any member, including
        self — leaving ends the household for the leaver). The removed
        user's refresh tokens are revoked BEFORE the membership row goes:
        devices lock on next use, never wipe. Requires a valid Bearer access
        token.
      tags:
        - Households
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Member to remove; must belong to the caller's household.
      responses:
        "204":
          description: Membership removed; the removed user's sessions revoked.
        "400":
          description: Missing user ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_body
                  message: Invalid request body
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthorized
                  message: Invalid or expired access token
        "404":
          description: No household, or the target is not a member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: household_not_found
                  message: Member is not in your household
        "500":
          $ref: "#/components/responses/InternalError"

