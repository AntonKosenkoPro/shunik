      operationId: confirmDocumentUpload
      summary: Confirm a document upload
      description: |
        Marks the document `ready=true` after the client PUT the bytes to
        the presigned URL. When the bytes are absent at the blob key the
        server returns 409 `upload_incomplete` and keeps `ready=false`.
        Requires a valid Bearer access token.
      tags:
        - Documents
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Upload confirmed — the document with ready=true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
