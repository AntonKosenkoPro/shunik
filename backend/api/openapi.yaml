openapi: "3.0.3"

info:
  title: Shunik API
  description: |
    Backend API for the Shunik personal time-tracking iOS app.

    ## Auth flow (passwordless email-OTP)
    1. **Request OTP** — `POST /api/v1/auth/otp/request` with an email address. Always returns 202
       (prevents user enumeration). The server upserts the user, generates a 6-digit code,
       and sends it via email (console in dev/test, AWS SES in production).
    2. **Verify OTP** — `POST /api/v1/auth/otp/verify` with the email and 6-digit code. On success,
       returns a JWT access token (15 min TTL) and an opaque refresh token.
    3. **Refresh** — `POST /api/v1/auth/refresh` with the refresh token and `X-Device-Id`.
       Issues a new token pair within the sending device's refresh family and revokes the
       old token. Reuse of a revoked token revokes only that device's family — other
       devices' sessions keep working. Response-loss recovery via the optional
       `refresh_attempt_id` is specified normatively on the operation itself.
    4. **Logout** — `POST /api/v1/auth/logout` with a Bearer access token and `X-Device-Id`.
       Revokes only the calling device's refresh family; other devices' sessions remain valid.
    5. **Me** — `GET /api/v1/auth/me` with a Bearer access token. Returns the user profile.

    ## Auth flow (Sign in with Apple)
    - **Apple** — `POST /api/v1/auth/apple` with Apple's identity-token JWT (RS256). The server
      verifies it against Apple's JWKS (iss/aud/exp) and upserts a user keyed by Apple's
      stable `sub` claim, then issues the same access + refresh token pair as the OTP flow.
       The route is always registered; without `APPLE_CLIENT_ID` it returns 503
       `apple_not_configured`.

    ## Device identity & per-device sessions
    - **Device id** — every session-carrying auth request (`/auth/otp/verify`,
      `/auth/apple`, `/auth/refresh`, `/auth/logout`) sends a stable client-generated
      UUID via the `X-Device-Id` header. The device id persists in the Keychain across
      app reinstalls and is minted fresh only when the device fingerprint changes
      (restore-on-new-phone).
    - **Per-device refresh families** — every issued refresh token is recorded against a
      concrete `device_id` (never an empty one); rotation stays within the issuing
      device's family. There is deliberately NO device quota: sign-in succeeds from any
      number of devices — no 409 `device_limit` response exists. Device limit counting
      is explicitly deferred to issue #46 (do not file its absence as a bug).
    - **Revocation semantics** — reuse detection and logout are scoped per-device:
      a replayed or logged-out device's refresh family is revoked while other devices'
      sessions stay valid. A device whose family is revoked or TTL-exhausted must
      re-authenticate from the auth gate; the client never wipes local data on
      session loss (lock-not-wipe is a client behavior, no server-side delete).
    - **Refresh TTL** — a device family's refresh tokens expire 7 days after issue;
      refresh attempts after that are rejected as unauthorized.

    ## Account deletion (explicit, in-app)
    - **Delete** — `DELETE /api/v1/auth/account` with a Bearer access token
      and `X-Device-Id`. Self-only; purges the account and all associated
      operational rows atomically. Apple accounts additionally revoke Apple
      authorization (204 complete, 202 pending with `account_deleted` +
      `apple_revocation_pending`); missing revocable material is 409
      `apple_credential_required` (obtain it via
      `POST /api/v1/auth/apple/deletion-credential` first).
    - **Status** — every session response carries a narrow
      `account_status_credential` (+ `account_status_expires_at`, 30 days).
      `POST /api/v1/auth/account/status` with that credential alone reports
      `active`/`deleted` for its own UUID — the only proof another device
      accepts for cleanup. Status never renews itself; generic 401/404s
      never count as deletion.
    - **Apple notifications** — `POST /api/v1/auth/apple/notifications`
      (verified Apple JWS). `consent-revoked` signs out pre-event sessions
      and preserves the account and data; reauthorization returns to the
      existing account. It is sign-out, never deletion.

    ## Security
    - No passwords. OTP codes and refresh tokens are stored only as SHA-256 hashes.
      The sole recoverable server-side refresh credential is the pending successor in
      a refresh recovery receipt, sealed with AES-256-GCM (account, device,
      predecessor, attempt, and fixed expiry as associated data) under the
      `REFRESH_RECOVERY_KEYS` keyring — never plaintext, never logged.
    - JWT access tokens use HS256 signing.
    - Rate limiting: 3 req/min for OTP request, 5 req/min for OTP verify (per IP+email).
    - User enumeration is prevented: `/api/v1/auth/otp/request` always returns 202.

  version: "2.0.0"
  contact:
    name: Anton Kosenko

servers:
  - url: http://127.0.0.1:8080
    description: Local development
  - url: https://shunik-api.antonkosenko.pro
    description: Production

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      description: Returns the server health status.
      tags:
        - Health
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [ok]
                    description: Health status
              example:
                status: ok

  /api/v1/auth/otp/request:
    post:
      operationId: requestOTP
      summary: Request an OTP code
      description: |
        Sends a 6-digit OTP code to the given email address. The user account is
        created automatically if it does not exist. Always returns HTTP 202 to
        prevent user enumeration — a 202 response does NOT guarantee that an email
        was sent (internal errors are silently swallowed).
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
            example:
              email: user@example.com
      responses:
        "202":
          description: Request accepted (email may or may not have been sent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_body
                  message: Invalid request body
        "429":
          description: Rate limited (3 req/min per IP+email)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: rate_limited
                  message: Too many requests. Please try again later.

  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOTP
      summary: Verify an OTP code
      description: |
        Verifies the 6-digit OTP code for the given email. On success, marks the
        user as email-verified and returns a JWT access token + opaque refresh token.
        The refresh token is recorded against the `X-Device-Id` device's refresh family.
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
            example:
              email: user@example.com
              code: "123456"
      responses:
        "200":
          description: OTP verified successfully — tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid request body (invalid email or code format) or missing device header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_body:
                  summary: Invalid email or code format
                  value:
                    error:
                      code: invalid_body
                      message: Invalid email or code
                invalid_request:
                  summary: Missing X-Device-Id header
                  value:
                    error:
                      code: invalid_request
                      message: X-Device-Id header is required
        "401":
          description: Invalid, expired, or exhausted OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_otp:
                  summary: Invalid code
                  value:
                    error:
                      code: invalid_otp
                      message: Invalid or expired code
                otp_expired:
                  summary: Code expired
                  value:
                    error:
                      code: otp_expired
                      message: Code has expired. Request a new one.
                otp_attempts_exceeded:
                  summary: Too many failed attempts
                  value:
                    error:
                      code: otp_attempts_exceeded
                      message: Too many incorrect attempts. Request a new code.
        "429":
          description: Rate limited (5 req/min per IP+email)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: rate_limited
                  message: Too many attempts. Please try again later.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/apple:
    post:
      operationId: signInWithApple
      summary: Sign in / register with Apple
      description: |
        Verifies Apple's identity-token JWT (RS256) against Apple's JWKS, validating the
        issuer, audience (the app's Bundle ID), and expiry. Upserts a user keyed by Apple's
        stable `sub` claim (Apple may withhold the email after the first authorization) and
        returns the same access + refresh token pair as the OTP flow. Apple users are
        considered email-verified. The refresh token is recorded against the
        `X-Device-Id` device's refresh family.

        This endpoint is always registered. When the server is not configured
        with `APPLE_CLIENT_ID`, it returns HTTP 503 (`apple_not_configured`).
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleSignInRequest"
            example:
              identity_token: eyJraWQiOi...id-token...
      responses:
        "200":
          description: Apple sign-in successful — tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid request body or missing device header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_body:
                  summary: Identity token missing or malformed
                  value:
                    error:
                      code: invalid_body
                      message: Identity token is required
                invalid_request:
                  summary: Missing X-Device-Id header
                  value:
                    error:
                      code: invalid_request
                      message: X-Device-Id header is required
        "401":
          description: |
            Apple identity token or authorization failed verification
            (`invalid_apple_token`): invalid identity token, Apple-rejected
            authorization code, code-exchange identity mismatch, or an
            authorization that predates the account's Apple consent cutoff
            (the client must re-authorize with Apple).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_identity_token:
                  summary: Identity token failed verification
                  value:
                    error:
                      code: invalid_apple_token
                      message: Invalid Apple identity token
                invalid_authorization_code:
                  summary: Authorization code rejected or mismatched
                  value:
                    error:
                      code: invalid_apple_token
                      message: Invalid Apple authorization code
                stale_authorization:
                  summary: Authorization predates consent revocation
                  description: Re-authorize with Apple; the token verifies but its authorization is older than the cutoff.
                  value:
                    error:
                      code: invalid_apple_token
                      message: This Apple authorization predates revocation. Re-authorize with Apple.
                email_in_use:
                  summary: Apple email already belongs to another account
                  value:
                    error:
                      code: apple_email_in_use
                      message: This email is already registered. Sign in with email instead.
        "429":
          description: Rate limited (per IP)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: rate_limited
                  message: Too many requests. Please try again later.
        "503":
          description: |
            Sign in with Apple is not configured on the server
            (`apple_not_configured`), or a pending Apple revocation fences
            this subject's signup (`apple_revocation_pending` — retryable;
            the code was not consumed and no session was created).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                apple_not_configured:
                  summary: Sign in with Apple is not configured
                  value:
                    error:
                      code: apple_not_configured
                      message: Sign in with Apple is not configured
                apple_revocation_pending:
                  summary: Signup fenced by pending Apple revocation
                  value:
                    error:
                      code: apple_revocation_pending
                      message: Apple unlinking is still in progress. Please retry shortly.
        "409":
          description: |
            The Apple identity's email already belongs to a different account
            (`apple_email_in_use`). Sign in with email instead; identities are
            never merged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: apple_email_in_use
                  message: This email is already registered. Sign in with email instead.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh access token
      description: |
        Exchanges a refresh token for a new access + refresh token pair.
        The old refresh token is revoked and the new one stays within the
        `X-Device-Id` device's refresh family. Rotation never affects other
        devices' sessions. There is deliberately NO device limit: no 409
        `device_limit` response exists (device quota counting is deferred to
        issue #46 — do not file its absence as a bug).

        Response-loss recovery: the optional `refresh_attempt_id` names one logical
        rotation (a client-generated UUID, durable across retries, suspension, and
        restart). Rotation commits predecessor revocation, successor insertion, and a
        pending recovery receipt atomically. Before the successor is consumed or
        revoked, repeating the same predecessor and accepted pending attempt returns
        the identical successor refresh credential plus a fresh access token — without
        rotating again and without revocation. Recovery holds until the successor's
        fixed refresh expiry and never extends it. Requests without the field keep
        legacy behavior with no recovery.

        Failure taxonomy: `invalid_refresh`, `token_reuse`, and `refresh_expired`
        keep their 401 meanings and revocation rules (revoked-before-expiry ordering
        preserved; wrong-device presentations are rejected without revocation or
        recovery). `refresh_attempt_completed` and `refresh_attempt_conflict` are 409
        non-authentication conflicts that revoke nothing. Database, crypto, and
        receipt failures are 500 service errors that revoke nothing.
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            example:
              refresh_token: abc123...
              refresh_attempt_id: 019639f1-7a3b-7abc-9def-100000000009
      responses:
        "200":
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid request body or missing device header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_body:
                  summary: Refresh token missing or malformed
                  value:
                    error:
                      code: invalid_body
                      message: Refresh token is required
                invalid_request:
                  summary: Missing X-Device-Id header
                  value:
                    error:
                      code: invalid_request
                      message: X-Device-Id header is required
        "401":
          description: |
            Invalid, revoked (reuse), or TTL-expired refresh token. Reuse detection is
            scoped per-device: only the offending device's refresh family is revoked —
            other devices' sessions keep working. After a revoked or TTL-expired family,
            the device must re-authenticate (the client locks to the auth gate with all
            local data intact; nothing is wiped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_refresh:
                  summary: Token not found or presented from the wrong device
                  value:
                    error:
                      code: invalid_refresh
                      message: Invalid refresh token
                token_reuse:
                  summary: Token reuse detected (offending device's family revoked)
                  value:
                    error:
                      code: token_reuse
                      message: Token has been revoked. The device's sessions have been invalidated.
                refresh_expired:
                  summary: Refresh family TTL exhausted (re-authenticate, local data intact)
                  value:
                    error:
                      code: refresh_expired
                      message: Refresh token has expired. Please sign in again.
        "409":
          description: |
            Non-authentication refresh conflict — nothing is revoked and no credentials
            are issued. `refresh_attempt_completed`: the attempt's successor was already
            consumed, revoked, or otherwise closed (a delayed duplicate after the client
            advanced — keep the current credentials). `refresh_attempt_conflict`: the
            attempt identifier is bound to a different predecessor (retry with the
            attempt bound to the presented token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                refresh_attempt_completed:
                  summary: Attempt already completed (delayed duplicate after advancement)
                  value:
                    error:
                      code: refresh_attempt_completed
                      message: Refresh attempt already completed. Use the current session token.
                refresh_attempt_conflict:
                  summary: Attempt rebound to a different predecessor
                  value:
                    error:
                      code: refresh_attempt_conflict
                      message: Refresh attempt does not match this token. Retry with the attempt bound to this token.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Logout
      description: |
        Revokes only the refresh family identified by the request's `X-Device-Id`;
        other devices' sessions remain valid. Requires a valid Bearer access token.
        After logout the client keeps all local data intact (logout never wipes).
      tags:
        - Auth
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
      responses:
        "204":
          description: Logout successful — the calling device's refresh family revoked
        "400":
          description: Missing X-Device-Id header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_request
                  message: X-Device-Id header is required
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthorized
                  message: Missing authorization header
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current user
      description: |
        Returns the authenticated user's profile with the current
        account-status credential, its expiry, and server-truth Apple
        deletion-readiness metadata. Requires a valid Bearer access token.
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile with status evidence and deletion metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthorized
                  message: Invalid or expired access token
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/account:
    delete:
      operationId: deleteAccount
      summary: Delete the authenticated account
      description: |
        Explicit, permanent, self-only account deletion. Targets the
        authenticated account only — no request-selected user id exists. The
        purge removes the account identity and all associated operational
        relay rows (OTPs, all-device sessions and recovery receipts,
        tombstones, Apple-vault data) atomically.

        Apple-created accounts additionally unlink Apple authorization:
        a stored revocable credential is revoked inline (204) or moved to a
        durable revocation job with bounded retry (202 with
        `account_deleted: true` and `apple_revocation_pending: true` — both
        reliable deletion acknowledgments; 202 never claims Apple unlinking
        completed). Without a stored credential the purge does not run: 409
        `apple_credential_required` (obtain same-subject authorization first).
        Unconfigured Apple revocation is a 503 deployment blocker, never a
        silent skip. Email-only deletions need no Apple work.

        After a lost response, POST /api/v1/auth/account/status with the
        pre-stored status credential resolves the outcome without a new login
        or another confirmation. Generic 401/404 responses are never deletion
        proof and authorize no local erasure.
      tags:
        - Auth
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
      responses:
        "204":
          description: Account purged; Apple revocation complete or not applicable.
        "202":
          description: Account purged; Apple unlinking durably pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionPendingResponse"
        "400":
          description: Missing X-Device-Id header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_request
                  message: X-Device-Id header is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Apple account without a stored revocable credential — no purge ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: apple_credential_required
                  message: Fresh Apple authorization is required before deleting this account
        "503":
          description: Apple revocation is not configured on the server (deployment blocker).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: apple_not_configured
                  message: Apple unlinking is not configured; account deletion is unavailable
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/account/status:
    post:
      operationId: accountStatus
      summary: Check whether the credential's account still exists
      description: |
        Read-only, narrowly scoped deletion evidence. Authenticates with the
        dedicated account-status credential (HS256, separate signing key,
        `aud=account-status`, exact account-UUID subject, 30-day expiry) —
        access tokens are rejected here and status credentials are rejected
        everywhere else. Returns the verified subject's existence only:
        `active` (including revoked-but-present accounts) or `deleted`. Only
        a `deleted` verdict authorizes another device's cleanup. Responses
        carry `Cache-Control: no-store`, are rate-limited, and never renew
        the credential. Invalid credentials return generic 401 with no
        existence disclosure; storage failures return 5xx, never `deleted`.
      tags:
        - Auth
      security:
        - StatusAuth: []
      responses:
        "200":
          description: Scoped existence verdict for the credential's own account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatusResponse"
        "401":
          description: Missing, invalid, or expired status credential (no existence disclosure).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthorized
                  message: Invalid or expired status credential
        "429":
          description: Rate limited (per IP).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: rate_limited
                  message: Too many requests. Please try again later.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/apple/deletion-credential:
    post:
      operationId: storeAppleDeletionCredential
      summary: Store an Apple revocable credential for explicit deletion
      description: |
        For an existing Apple account with no stored revocable credential
        (identity-token-only history): verifies the presented identity token,
        requires the SAME Apple subject as the authenticated account, exchanges
        the fresh authorization code with Apple, and seals the refresh token.
        Never creates a user, a Shunik session, or touches another account.
        Wrong identities fail safely; email-only accounts are rejected.
      tags:
        - Auth
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleDeletionCredentialRequest"
      responses:
        "200":
          description: Apple credential stored.
          content:
            application/json:
              schema:
                type: object
                required:
                  - stored
                properties:
                  stored:
                    type: boolean
                    enum: [true]
              example:
                stored: true
        "400":
          description: Invalid body or email-only account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_body:
                  summary: Identity token or code missing
                  value:
                    error:
                      code: invalid_body
                      message: Identity token and authorization code are required
                invalid_request:
                  summary: Account has no Apple identity
                  value:
                    error:
                      code: invalid_request
                      message: Account has no Apple identity
        "401":
          description: Identity or code failed verification, or the subject differs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_apple_token
                  message: Apple identity does not match this account
        "503":
          description: Apple not configured, or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                apple_not_configured:
                  summary: Apple revocation not configured
                  value:
                    error:
                      code: apple_not_configured
                      message: Sign in with Apple is not configured
                apple_unavailable:
                  summary: Apple temporarily unavailable
                  value:
                    error:
                      code: apple_unavailable
                      message: Apple is temporarily unavailable. Please retry.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/apple/notifications:
    post:
      operationId: appleNotifications
      summary: Receive Apple server-to-server notifications
      description: |
        Apple's server-to-server endpoint (verified JWS payload, no bearer).
        `consent-revoked` ends the affected account's pre-event Shunik sessions
        across devices and closes their recoveries while preserving the
        account, data, files, and cursors; reauthorizing the same Apple
        subject returns to the existing account. `consent-revoked` requires
        the documented `events.event_time` — undated revocations are rejected
        with 400 and change nothing (arrival time is never substituted, so a
        delayed undated event cannot kill a newer reauthorization). The cutoff
        is applied before its delivery id is recorded, so a transient failure
        never loses the revocation on retry. Every other event type
        (email-enabled/disabled, whole-Apple-Account deletion, unknown future
        types) is a verified no-op: never a deletion, never an upsert, never
        a session end. Missing users are idempotent no-ops; replays
        (duplicate `jti`) are idempotent 200s; invalid payloads are 401 with
        no state change.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleNotificationRequest"
          application/x-www-form-urlencoded:
            description: |
              Apple's actual delivery media type: the signed JWS arrives as a
              single `payload` form value. The handler accepts both media
              types; form takes precedence when both are present.
            schema:
              type: object
              required:
                - payload
              properties:
                payload:
                  type: string
                  description: Apple-signed notification JWS.
                  example: eyJraWQiOi...notification...
      responses:
        "200":
          description: Notification accepted (processed or idempotent no-op).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_body
                  message: Invalid request body
        "401":
          description: Notification signature or claims failed verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_notification
                  message: Invalid Apple notification
        "429":
          description: Notification intake rate limited (per IP; high ceiling — Apple's delivery retries are never throttled in practice).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: rate_limited
                  message: Too many requests. Please try again later.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/households/mine:
    get:
      operationId: getMyHousehold
      summary: Get my household
      description: |
        Returns the caller's household with its owner members. Auto-creates
        the household (caller as owner) when the caller has none — sign-in
        normally ensures one, this heals the self-leave edge without a round
        trip. Requires a valid Bearer access token.
      tags:
        - Households
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Household with owner members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdWithMembers"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthorized
                  message: Invalid or expired access token
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/households/invites:
    post:
      operationId: createInvite
      summary: Invite by email
      description: |
        Records an email invitation to the caller's household and emails the
        token to the invitee. Always 202 — the response never reveals whether
        the address has an account (user-enumeration closed). Re-inviting the
        same address replaces the pending invite. Rate limited per IP (sends
        email). Requires a valid Bearer access token.
      tags:
        - Households
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "202":
          description: Invitation recorded (delivery attempted).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invitation sent if the address can receive mail
        "400":
          description: Invalid request body or email address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_body
                  message: Invalid email address
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthorized
                  message: Invalid or expired access token
        "429":
          description: Invitation creation rate limited (per IP).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: rate_limited
                  message: Too many requests. Please try again later.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/households/invites/accept:
    post:
      operationId: acceptInvite
      summary: Accept invitation
      description: |
        Joins the caller to the invite's household. Unknown, consumed, and
        expired tokens are indistinguishable (404 invite_not_found). Callers
        already in a household are rejected (409 already_member) — day-1 rule.
        Requires a valid Bearer access token.
      tags:
        - Households
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: Joined — household with owner members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdWithMembers"
        "400":
          description: Invalid request body or token format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_body
                  message: Invalid invitation token
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthorized
                  message: Invalid or expired access token
        "404":
          description: Invitation not found or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
