name: backend

# Requirements S6: linters + tests run on every pull request as a mandatory check.
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy to"
        type: choice
        options: [stage, prod]
        default: stage
        required: true
      skip_checks:
        description: "Skip lint + test (re-deploy only)"
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  packages: write  # needed to push to GHCR

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: gofmt
        working-directory: backend
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::gofmt would reformat the following files:"; echo "$out"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend

      - name: go test
        working-directory: backend
        run: go test ./... -race -coverprofile=coverage.out

      - name: coverage summary and gate
        working-directory: backend
        run: |
          total="$(go tool cover -func=coverage.out | tail -1)"
          echo "$total"
          cov="$(printf '%s' "$total" | grep -oE '[0-9.]+%' | tr -d '%')"
          if [ -z "$cov" ]; then
            echo "::error::could not parse total coverage from: $total"
            exit 1
          fi
          echo "total coverage: ${cov}%"
          # No-regression floor. Ratchets up as the catalog feature closes gaps; the exact
          # hard floor awaits team approval (test design Quality Gate Criteria).
          floor=45
          if [ "${cov%.*}" -lt "$floor" ]; then
            echo "::error::total coverage ${cov}% below floor ${floor}%"
            exit 1
          fi

  deploy:
    # push to main auto-deploys to prod; workflow_dispatch deploys the chosen
    # environment (default stage). Per-environment branch + reviewer gating is
    # enforced in GitHub's Environment settings, not here.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'stage' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: image
        run: |
          REPO="${{ github.repository }}"
          echo "tag=ghcr.io/${REPO,,}/backend:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose and nginx configs to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "backend/docker-compose.prod.yml,backend/nginx"
          target: "/opt/timeoflife"
          strip_components: 1

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/timeoflife

            # Back up the current .env before regenerating (recoverable, not authoritative).
            [ -f .env ] && cp .env ".env.bak.$(date +%Y%m%d-%H%M%S)" || true

            # Regenerate .env from GitHub Actions secrets. This is what makes redeploy
            # self-healing: the secrets' source of truth is GitHub Actions, and every
            # deploy rewrites a correct, complete .env on the VM.
            # Quoted heredoc: GitHub substitutes ${{ secrets.* }} literals; the remote
            # shell does no expansion, so values with $ or ` survive verbatim.
            cat > .env <<'ENVEOF'
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EMAIL_BACKEND=${{ vars.EMAIL_BACKEND }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ vars.AWS_REGION }}
            SES_FROM=${{ vars.SES_FROM }}
            APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}
            APPLE_JWKS_URL=${{ vars.APPLE_JWKS_URL }}
            TRUSTED_PROXIES=${{ vars.TRUSTED_PROXIES }}
            # Hosted-DB split (migrate-db-to-supabase-free): empty (default)
            # keeps the VM-local Postgres composed from DB_PASSWORD below; a
            # set value repoints the backend at hosted Postgres (Supabase
            # session-mode pooler). Rollback stays config-only: clear the
            # secret and redeploy. Prefer alphanumeric-safe secrets ($ in a
            # value breaks the sourcing step below, same as DB_PASSWORD).
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            # Error reporting (observability-stage-0): empty keeps Sentry
            # disabled; set the secret to enable panic/5xx capture.
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            # Refresh recovery (fix-refresh-response-loss): comma-separated 64-hex
            # AES-256 keys, first = primary. The backend fail-fasts without it,
            # so this secret must exist before the new binary deploys. Rotation:
            # prepend the new key (oldest stays usable for pending receipts),
            # deploy, then remove the retired key on a later deploy. Never
            # delete pending receipts as part of a rollback — previous binaries
            # ignore the variable and pending receipts expire naturally.
            REFRESH_RECOVERY_KEYS=${{ secrets.REFRESH_RECOVERY_KEYS }}
            ENVEOF
            chmod 600 .env

            # Validate before bringing services up — fail loudly in CI instead of
            # crashlooping on the VM with empty/missing config.
            set -a; . ./.env; set +a
            : "${DB_PASSWORD:?secret DB_PASSWORD is empty}"
            : "${JWT_SECRET:?secret JWT_SECRET is empty}"
            [ "${#JWT_SECRET}" -ge 32 ] || { echo "JWT_SECRET must be at least 32 bytes"; exit 1; }
            # Format check mirrors ParseRecoveryKeys (config.go): comma-separated,
            # edge-trimmed, empties ignored, every entry 64 hex chars (32 bytes).
            # A malformed value would otherwise pass this pre-flight and
            # crash-loop the freshly deployed container at boot. Interior
            # whitespace is rejected (Go trims edges only; hex.DecodeString
            # fails on interior space), so strip-all must equal edge-trimmed.
            __rec_ok=1; __rec_count=0
            __rec_rest="${REFRESH_RECOVERY_KEYS},"
            while [ -n "$__rec_rest" ]; do
              __rec_raw="${__rec_rest%%,*}"; __rec_rest="${__rec_rest#*,}"
              __rec_edge="$(printf '%s' "$__rec_raw" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -z "$__rec_edge" ] && continue
              case "$__rec_edge" in
                *[[:space:]]*) __rec_ok=0; continue ;;
              esac
              __rec_count=$((__rec_count + 1))
              case "$__rec_edge" in
                *[!0-9a-fA-F]*|"") __rec_ok=0 ;;
                *) if [ "${#__rec_edge}" -ne 64 ]; then __rec_ok=0; fi ;;
              esac
            done
            [ "$__rec_ok" -eq 1 ] && [ "$__rec_count" -ge 1 ] || { echo "REFRESH_RECOVERY_KEYS must be comma-separated 64-char hex keys (openssl rand -hex 32); empty or malformed values fail the backend boot check"; exit 1; }
            : "${REFRESH_RECOVERY_KEYS:?secret REFRESH_RECOVERY_KEYS is empty (fix-refresh-response-loss: backend fail-fasts without the recovery keyring)}"
            # EMAIL_BACKEND is a non-secret per-environment variable (vars.EMAIL_BACKEND),
            # not a secret. Default to console when unset — compose also defaults to console.
            EMAIL_BACKEND="${EMAIL_BACKEND:-console}"
            case "$EMAIL_BACKEND" in
              console|ses) ;;
              *) echo "EMAIL_BACKEND '$EMAIL_BACKEND' is not one of console|ses"; exit 1 ;;
            esac
            if [ "$EMAIL_BACKEND" = ses ]; then
              : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID required when EMAIL_BACKEND=ses}"
              : "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY required when EMAIL_BACKEND=ses}"
              : "${AWS_REGION:?AWS_REGION required when EMAIL_BACKEND=ses}"
              : "${SES_FROM:?SES_FROM required when EMAIL_BACKEND=ses}"
            fi
            # DATABASE_URL selects the database: empty keeps VM-local Postgres;
            # a set value must be a TLS-only hosted URL (fail loudly otherwise).
            if [ -n "${DATABASE_URL:-}" ]; then
              case "$DATABASE_URL" in
                *sslmode=require*) ;;
                *) echo "DATABASE_URL for hosted Postgres must use sslmode=require"; exit 1 ;;
              esac
              # Session-scoped migration advisory lock is invalid through a
              # transaction-mode pooler: reject port 6543 (Supabase UI surfaces
              # it prominently) so a set-once secret mistake fails here instead
              # of hanging boots on pg_advisory_lock. Use port 5432.
              case "$DATABASE_URL" in
                *:6543/*)
                  echo "DATABASE_URL uses the transaction-mode pooler (6543), which breaks the migration advisory lock; use the session-mode pooler (5432)."; exit 1 ;;
              esac
            fi

            # Use the production compose file (local .env is read from this cwd).
            cp docker-compose.prod.yml docker-compose.yml

            # Log in to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the new image
            docker compose pull backend

            # Recreate all services
            docker compose up -d

            # Dead-man's-switch pinger (observability-stage-0): every minute,
            # curl /health through nginx and ping Healthchecks.io only on 200.
            # Missed pings page Telegram via the HC integration. Empty secret =
            # skipped with a warning (staging can deploy before accounts exist).
            if [ -n "${{ secrets.HC_PING_URL }}" ]; then
              (crontab -l 2>/dev/null | grep -v 'hc-ping.com' || true; echo "*/1 * * * * curl -sk -m 10 -f https://127.0.0.1/health >/dev/null 2>&1 && curl -sm 10 \"${{ secrets.HC_PING_URL }}\" >/dev/null 2>&1") | crontab -
              echo "healthchecks pinger installed"
            else
              echo "::warning::HC_PING_URL secret is empty — skipping healthchecks pinger install"
            fi

            # Clean up old images
            docker image prune -f

            echo "Deployment complete"
