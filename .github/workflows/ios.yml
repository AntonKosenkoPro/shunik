name: ios

# Requirements S6: linters + tests run on every pull request as mandatory checks.
# Provider split (move-ios-checks-to-xcode-cloud): PR/push verification moved
# to Xcode Cloud (see docs/ci.md). This workflow keeps NO automatic triggers —
# it runs only as release verification via `workflow_call` from release.yml
# (GITHUB_TOKEN pushes trigger no workflows, so release invokes it
# explicitly). Intentional billed-minutes residue: one macOS run per release.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen + swiftlint
        run: brew install xcodegen swiftlint

      - name: Generate Xcode project
        working-directory: ios/TimeOfLife
        run: xcodegen generate

      - name: SwiftLint
        working-directory: ios/TimeOfLife
        run: swiftlint lint --strict

      - name: Build with warnings as errors
        # SWIFT_TREAT_WARNINGS_AS_ERRORS/GCC_TREAT_WARNINGS_AS_ERRORS are set
        # per-target in project.yml — the CLI variants conflict with the
        # -suppress-warnings flag Xcode adds to SPM package targets (GRDB).
        working-directory: ios/TimeOfLife
        run: |
          set -o pipefail
          xcodebuild -scheme TimeOfLife \
            -destination 'generic/platform=iOS Simulator' \
            build | xcpretty

      - name: Resolve simulator destination
        id: sim
        working-directory: ios/TimeOfLife
        run: |
          NAME=$(xcrun simctl list devices available -j | \
            python3 -c 'import json,sys
          ds=json.load(sys.stdin)["devices"]
          print(next(d["name"] for rt in ds for d in ds[rt]
                     if "iPhone" in d["name"] and d.get("isAvailable")))')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: ios/TimeOfLife
        run: |
          set -o pipefail
          xcodebuild -scheme TimeOfLife \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            test | xcpretty
